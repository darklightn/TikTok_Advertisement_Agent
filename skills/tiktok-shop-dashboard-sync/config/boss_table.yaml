  type: number
  record_types:
  - 店铺汇总
  nullable: true
- name: 广告收入
  type: number
  record_types:
  - 店铺汇总
  nullable: true
- name: 实际ROI
  type: number
  record_types:
  - 店铺汇总
  nullable: true
- name: 广告订单
  type: number
  record_types:
  - 店铺汇总
  nullable: true
